<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

      <span class="logo-text">airen</span>
      <span class="logo-subtitle">ML Reliability</span>
    </a>

      <a class="nav-link nav-link-live" href="/live">live ▶</a>

  <footer class="footer">
    <span>Airen v0.1.0 · Powered by Gemini · Phoenix observability</span>
  </footer>
