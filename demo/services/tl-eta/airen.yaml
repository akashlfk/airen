# Per-service config for FK Truckload ETA — the Fritolay-incident reference impl.
#
# Loader: airen.config.load_service_config("tl-eta")
# Runner: python -m airen.run_orchestrator tl-eta

service:
  name: tl-eta
  description: FourKites Truckload ETA — LSTM v3
  owner_team: otr-ds

phoenix:
  project_name: tl-eta-prediction
  collector_endpoint: http://localhost:6006

# How the inference layer serves predictions → where Airen observes them.
serving:
  mode: sync-api              # request/response API (not streaming)
  prediction_source: phoenix  # live feed Airen reads to judge health
  endpoints:
    - POST /predict

# The Phoenix span schema Sentinel reads. Was hardcoded; now per-service.
observation:
  problem_type: regression
  error_attribute: eval.absolute_error_minutes   # what Sentinel averages
  metric_unit: minutes
  metric_direction: lower_is_better
  segments:                                       # health is broken down by these
    - input.shipper
    - input.api_fetch_limit

github:
  repo: cloudqwest/dynamic_eta_prediction
  default_branch: production
  # Feature-engineering attribute names that typically surface as code constants —
  # Investigator greps the repo for these when an anomaly is segmented on them.
  attributes_of_interest:
    - api_fetch_limit
    - seq_len
    - max_pings
    - batch_size

slack:
  # If alert_channel is set, Orchestrator overrides the global SLACK_CHANNEL env
  # for posts from this service. Leave null to use the env default.
  alert_channel: null
  enable: true

jira:
  # Real ETAI project (FK's "ETA Intelligence" software project) — confirmed
  # accessible via the AIREN_JIRA_* creds in .env on 2026-05-31.
  project_key: ETAI
  enable: true
  # ETAI's available issue types: Story, Engineering Story, Spike, Bug,
  # Root Cause Analysis, Defect, Tech Improvement, DS Experiment, etc.
  # "Root Cause Analysis" (id=12010) is semantically perfect for Airen output.
  issue_type: "Root Cause Analysis"
  # ETAI's workflow is ML/DS-specific (statuses like Refinement In Progress,
  # Analysis, Experiment, etc.) — none of the standard "In Progress" / "Done"
  # transitions exist. We skip transitions and rely on comments for the full
  # incident lifecycle. Humans drive the actual workflow status.
  transition_on_alert: null
  transition_on_pass: null
  transition_on_fail: null

# User-declared custom metrics (augment Airen's always-on default battery).
metrics:
  - name: p95_error_minutes
    attribute: eval.absolute_error_minutes
    agg: p95
    direction: lower_is_better
    warn_ratio: 1.5
    critical_ratio: 2.0

sentinel:
  baseline_mae_minutes: 150.0   # healthy ~120; 150 gives headroom for noise
  warning_ratio: 1.2
  critical_ratio: 2.0
  default_lookback_minutes: 2880   # 48h — fits the demo span window
  # PSI baselines — what the model was TRAINED on. Production drift away from
  # these is what flagged the Fritolay incident.
  attribute_baselines:
    api_fetch_limit: "184"
    seq_len: "48"
    max_pings: "250"
  psi_warning: 0.10
  psi_critical: 0.25

# ── FK-only sections (enabled only when running on the FK VM with VPN routing) ──
redshift:
  # Connection topology in yaml; ONLY REDSHIFT_PASSWORD lives in .env.
  # host/database/user left null → adapter falls back to REDSHIFT_* env vars.
  host: null
  database: null
  user: null
  table: tl_eta_predictions   # placeholder; confirm with Akash's Redshift schema
  actuals_table: tl_eta_datamart
  enable: false   # flip on when AIREN_REDSHIFT_MODE=real on the FK VM
                  # Sentinel will then use 7-day rolling MAE as the baseline

# Training-time baselines from S3. When enabled, Sentinel pulls the actual
# training MAE + attribute distributions from S3 instead of using the yaml
# values below. Falls back gracefully if the object is missing.
s3:
  # bucket/region in yaml; AWS creds (AWS_ACCESS_KEY_ID/SECRET) stay in .env.
  # bucket null → falls back to S3_BASELINES_BUCKET env.
  bucket: null
  region: us-east-1
  model_version: null   # null = always use latest.json
  enable: true   # mock-mode by default; flip AIREN_S3_MODE=real for real S3

# Each production model_family Airen monitors maps to an MLflow experiment.
# Sentinel emits GOVERNANCE_RISK signals when a model lacks git-traceable
# training code (see TrainingProvenance in airen/schemas.py).
model_registry:
  - model_family: PatchTST
    experiment_id: "2455"
    expected_repo: cloudqwest/dynamic_eta_prediction
    notes: "Transformer (sequence modeling). Training: training_pipeline/auto_trainer/."
  - model_family: CHEP_Classification
    experiment_id: "3835"
    expected_repo: null
    notes: "Bin-classification ensemble (RF+LGBM+XGB). UNGOVERNED — training source is /home/eng1/vik/chep_classification.py, no git."
  - model_family: CHEP_First_CheckCall
    experiment_id: "3830"
    expected_repo: null
    notes: "First-checkcall LGBM. UNGOVERNED — same as CHEP_Classification."

mlflow:
  # Real FK MLflow tracking server is VPN-gated, no auth.
  # Confirmed accessible 2026-05-31 via MLFLOW_TRACKING_URI=https://mlflow-dev.fourkites.com/
  # The TL-ETA-prediction-sequence-modeling experiment (id 2455) holds the
  # PatchTST transformer that's closest to the production LSTM in the demo
  # storyline. Its latest run has 31 params + 9 metrics; `api_fetch_limit`
  # is NOT among them, so Investigator's training/inference mismatch check
  # returns the expected drift signal against real production data.
  # tracking_uri is a non-secret URL → yaml. (FK MLflow is no-auth.)
  tracking_uri: https://mlflow-dev.fourkites.com
  experiment_name: "TL-ETA-prediction-sequence-modeling"
  enable: true

kafka:
  # Connection topology in yaml; ONLY SASL creds (KAFKA_SASL_USERNAME/PASSWORD)
  # live in .env. bootstrap_servers null → falls back to KAFKA_BOOTSTRAP_SERVERS env.
  bootstrap_servers: null
  input_topic: tl_eta_requests
  output_topic: tl_eta_predictions
  group_id: airen-tl-eta
  security_protocol: SASL_SSL
  sasl_mechanism: PLAIN
  enable: false   # flip on when running on FK VM
