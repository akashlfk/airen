# Per-service config for FK Ocean ETA — proves Airen generalizes beyond
# the Fritolay/TL scenario. Different model, different feature schema,
# different bug class (vessel_class drift, not api_fetch_limit truncation).
#
# Loader: airen.config.load_service_config("ocean-eta")
# Runner: python -m airen.run_orchestrator ocean-eta

service:
  name: ocean-eta
  description: FourKites Ocean ETA — XGBoost v2 (transit-time prediction, hours not minutes)
  owner_team: ocean-ds

phoenix:
  project_name: ocean-eta-prediction
  collector_endpoint: http://localhost:6006

# Ocean ETA is a STREAMING inference layer — it consumes route events from one
# Kafka topic and produces transit-time predictions to another (no sync API).
# This demonstrates topology-aware onboarding: a different serving mode than TL.
serving:
  mode: async-kafka
  prediction_source: kafka     # predictions land on the output topic, not Phoenix
  input_topic: ocean_route_events
  output_topic: ocean_eta_predictions

# Different span schema from TL-ETA — proves the observation block generalizes.
# Transit error is still in minutes, but segmented on vessel_class / port_pair.
observation:
  problem_type: regression
  error_attribute: eval.absolute_error_minutes
  metric_unit: minutes
  metric_direction: lower_is_better
  segments:
    - input.vessel_class
    - input.port_pair

github:
  # Hypothetical repo for the demo — point at the real one when onboarding for real.
  repo: cloudqwest/ocean_eta_prediction
  default_branch: main
  attributes_of_interest:
    - vessel_class
    - port_pair
    - weather_api_version
    - n_route_segments

slack:
  alert_channel: null   # falls back to SLACK_CHANNEL env
  enable: true

jira:
  project_key: OCEAI         # different Jira project from TL ETA's "ETAI"
  enable: true
  transition_on_alert: "In Progress"
  transition_on_pass: "Done"
  transition_on_fail: null

sentinel:
  # Ocean transit MAE is in minutes too (so Sentinel math is unchanged), but
  # represents hours-scale errors: healthy ≈ 240 min (4h), critical ≈ 480 min (8h).
  baseline_mae_minutes: 240.0
  warning_ratio: 1.2
  critical_ratio: 2.0
  default_lookback_minutes: 2880
  # PSI baselines — training distribution. The demo bug is `vessel_class`
  # drifting because a new tanker route launched without retraining.
  attribute_baselines:
    vessel_class: "container"
    weather_api_version: "v3"
  psi_warning: 0.10
  psi_critical: 0.25

# FK-only sections — disabled by default, flip on when running on FK VM
redshift:
  host: null            # topology in yaml; REDSHIFT_PASSWORD stays in .env
  database: null
  user: null
  table: ocean_eta_predictions
  actuals_table: ocean_eta_datamart
  enable: false

s3:
  bucket: null          # falls back to S3_BASELINES_BUCKET env; AWS creds in .env
  region: us-east-1
  model_version: null   # always pull latest training baseline
  enable: true

mlflow:
  tracking_uri: https://mlflow-dev.fourkites.com
  experiment_name: ocean-eta-prod
  enable: false

kafka:
  # The live prediction feed for this streaming service. SASL creds in .env.
  bootstrap_servers: null
  input_topic: ocean_route_events
  output_topic: ocean_eta_predictions
  group_id: airen-ocean-eta
  security_protocol: SASL_SSL
  sasl_mechanism: PLAIN
  enable: false
